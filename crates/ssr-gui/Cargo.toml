[package]
name = "support-step-recorder-gui"
description = "egui/glow interface of Support Step Recorder: record, review and export a session."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["screen-recorder", "psr", "wayland", "egui", "screenshot"]
categories = ["multimedia", "gui"]

[[bin]]
name = "ssr"
path = "src/main.rs"

[features]
default = []
# Let egui_mcp drive the running GUI (EGUI_INSPECTION=1): development only.
inspection = ["eframe/inspection"]

[dependencies]
support-step-recorder-core = { path = "../ssr-core", version = "0.1.3" }
# `persistence` keeps the theme, zoom, language and window geometry.
eframe = { version = "0.37", features = ["glow", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
image = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
# Native, cross-platform "Save as" dialog (native on Windows/macOS; on Linux
# through the xdg-desktop-portal, without a GTK dependency).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
